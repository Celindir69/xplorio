<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Xplorio">
<title>Xplorio</title>
<link rel="apple-touch-icon" sizes="180x180" href="web/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="web/icons/favicon-32.png">
<link rel="manifest" href="web/manifest.json">
<script>
  /* Installed build (written by make-plugin): reload scripts and styles only after an update.
     Without web/build.js (development) fresh every time. */
  document.write('<script src="web/build.js?t=' + Date.now() + '" onerror="void 0"><\/script>');
</script>
<script>
  var XV = window.XPLORIO_BUILD || String(Date.now());
  document.write('<link rel="stylesheet" href="web/css/base.css?v=' + XV + '">' +
                 '<link rel="stylesheet" href="web/css/app.css?v=' + XV + '">');
</script>
<script src="/socket.io/socket.io.js"></script>
<script>
  /* always load the settings fresh (Safari/iPad otherwise keep them cached for a long time) */
  document.write('<script src="web/config.js?t=' + Date.now() + '"><\/script>' +
                 '<script src="web/config.local.js?t=' + Date.now() + '" onerror="void 0"><\/script>');
</script>
<script>
  /* light/dark (theme.js), pick the language and load language files (i18n.js loads web/lang/<code>.js) */
  document.write('<script src="web/js/theme.js?v=' + XV + '"><\/script>' +
                 '<script src="web/js/i18n.js?v=' + XV + '"><\/script>');
</script>
</head>
<body>

<div id="bg"></div>
<div id="bgTint"></div>
<div id="scrim"></div>

<div id="toast"></div>

<div id="topBar">
  <div class="topBtn na" id="btnRotelPower" title="Rotel ein/aus" data-i18n-title="html.rotelPower">
    <svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
  </div>
  <div id="lyrShiftBar">                   <!-- stage view: lyrics earlier/later, centered above the lyrics -->
    <div class="topBtn lyrShift" id="btnLyrEarlier" data-d="-500" title="Lyrics früher" data-i18n-title="html.lyricsEarlier">
      <svg viewBox="0 0 24 24"><path d="M5 11h14v2H5z"/></svg>
    </div>
    <div class="topBtn lyrShift" id="btnLyrLater" data-d="500" title="Lyrics später" data-i18n-title="html.lyricsLater">
      <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
    </div>
  </div>
  <div id="topRight">
    <div class="topBtn" id="btnRemote" title="Verstärker" data-i18n-title="html.remote" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M15 2H9a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm0 18H9V4h6v16zm-3-15a1.75 1.75 0 1 0 0 3.5A1.75 1.75 0 0 0 12 5zm-2 6h4v1.6h-4zm0 3h1.5v1.5H10zm2.5 0H14v1.5h-1.5zM10 17h1.5v1.5H10zm2.5 0H14v1.5h-1.5z"/></svg>
    </div>
    <div class="topBtn" id="btnStage" title="Layout wechseln (Display mit Lyrics)" data-i18n-title="html.layout">
      <svg viewBox="0 0 24 24"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 2v12h7V6H4zm9 0v12h7V6h-7zM5 7h5v4H5V7zm0 5.5h5V14H5v-1.5zm9-5.5h5v1.5h-5V7zm0 3h5v1.5h-5V10zm0 3h5v1.5h-5V13z"/></svg>
    </div>
    <div class="topBtn" id="scanBusy" style="display:none">   <!-- library is being read in (check.js) -->
      <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
    </div>
    <div class="topBtn" id="btnMenu" title="Menü" data-i18n-title="html.menu">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
    </div>
  </div>
</div>

<div id="app">
  <div id="topSpacer"></div>
  <div id="coverWrap"><img id="cover" alt=""></div>
  <div id="rightPane">
    <div id="meta">
      <div id="mArtist"></div>
      <div id="mTitle"></div>
      <div id="mAlbum"></div>
      <div id="mTechRow"><span id="mBadge" class="qBadge"></span><span id="mTech"></span></div>
      <div id="mGenre"></div>
    </div>
    <div id="seekWrap">
      <div id="seekBar"><div id="seekFill"></div></div>
      <div id="seekTimes">
        <span id="tElapsed">0:00</span>
        <span id="tRemain">0:00</span>
      </div>
    </div>
    <div id="ctrl">
      <div id="cRepeat">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        <span class="badge"></span>
      </div>
      <div class="ctrlBtn side" id="cPrev">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg>
      </div>
      <div class="ctrlBtn main" id="cPlay">
        <svg viewBox="0 0 24 24" id="playIcon"><path d="M7 5v14l12-7z"/></svg>
      </div>
      <div class="ctrlBtn side" id="cNext">
        <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6v12l10.5-6z"/></svg>
      </div>
      <div id="cRandom">
        <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </div>
    </div>

<div id="volWrap" class="off">
  <div class="vBtn" id="vMute"></div>
  <div class="vBtn" id="vDown"><svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg></div>
  <input type="range" id="vSlider" min="0" max="70" step="1" value="0">
  <div class="vBtn" id="vUp"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div>
  <div id="vVal">--</div>
</div>

  
  <div id="actions">
      <div class="actBtn" id="btnLyrics">
        <svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm0 14H6l-2 2V4h16v12zM7 9h10v2H7zm0 4h7v2H7z"/></svg>
      </div>
      <div class="actBtn" id="btnInfo">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
      </div>
      <div class="actBtn has-content" id="btnQueue">
        <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h12v2H3z"/></svg>
      </div>
      <div class="actBtn has-content" id="btnPlaylists">
        <svg viewBox="0 0 24 24"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>
      </div>
      <div class="actBtn has-content" id="btnSearch">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </div>
    </div>
  </div>
</div>

<!-- Lyrics overlay -->
<div class="overlay" id="overlayLyrics">
  <div class="overlayHandle"></div>
  <div class="overlayHead">
    <h2 data-i18n="html.lyrics">Lyrics</h2>
    <div id="lyrSync" title="Lyrics früher oder später (wird je Titel gemerkt)" data-i18n-title="html.lyricsSync">
      <button class="lyrShift" data-d="-500" aria-label="Lyrics früher" data-i18n-aria="html.lyricsEarlier">−</button>
      <span id="lyrSyncVal" title="Tippen: zurück auf 0" data-i18n-title="html.lyricsSyncReset" data-i18n="html.sync">sync</span>
      <button class="lyrShift" data-d="500" aria-label="Lyrics später" data-i18n-aria="html.lyricsLater">+</button>
    </div>
    <div class="overlayClose" id="closeLyrics">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </div>
  </div>
  <div class="overlayBody"><div id="lyricsText" data-i18n-empty="lyrics.none"></div></div>
</div>

<!-- Info overlay -->
<div class="overlay" id="overlayInfo">
  <div class="overlayHandle"></div>
  <div class="overlayHead">
    <h2 id="infoOverlayTitle" data-i18n="html.info">Info</h2>
    <div class="overlayClose" id="closeInfo">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </div>
  </div>
  <div class="overlayBody" id="infoOverlayBody">
    <div id="infoTabs"></div>
    <div id="infoSlider"><div id="infoContent"></div></div>
  </div>
</div>

<!-- Queue overlay -->
<div class="overlay" id="overlayQueue">
  <div class="overlayHandle"></div>
  <div class="overlayHead">
    <h2 data-i18n="html.queue">Warteschlange</h2>
    <div class="overlayClose" id="closeQueue">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </div>
  </div>
  <div id="queuePanels">
    <div id="queueList"></div>
  </div>
</div>

<!-- Mood Mix/playlists/radio overlay -->
<div class="overlay" id="overlayPlaylists">
  <div class="overlayHandle"></div>
  <div class="overlayHead">
    <h2 id="plOverlayTitle" data-i18n="html.playlists">Playlisten</h2>
    <div class="overlayClose" id="closePlaylists">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </div>
  </div>
  <div id="plTabBar">
    <div class="qTab" id="plTab0" style="display:none" data-i18n="html.tab.moodMix">Mood Mix</div>
    <div class="qTab on" id="plTab1" data-i18n="html.tab.playlists">Playlisten</div>
    <div class="qTab" id="plTab2" data-i18n="html.tab.radio">Radio</div>
  </div>
  <div id="plPanels">
    <div id="mixBody"></div>
    <div id="playlistResults"></div>
    <div id="radioPanel"></div>
  </div>
</div>

<!-- Search overlay -->
<div class="overlay" id="overlaySearch">
  <div class="overlayHandle"></div>
  <div class="overlayHead">
    <h2 data-i18n="html.search">Suchen &amp; Entdecken</h2>
    <div id="searchSources">
      <label><input type="checkbox" id="srcLocal" checked> <span data-i18n="html.src.local">Lokal</span></label>
      <label class="srcTidal"><input type="checkbox" id="srcTidal" checked> TIDAL</label>
      <label class="srcQobuz"><input type="checkbox" id="srcQobuz" checked> Qobuz</label>
      <label class="srcHra" title="HIGHRESAUDIO"><input type="checkbox" id="srcHra" checked> HRA</label>
      <label class="srcSpotify"><input type="checkbox" id="srcSpotify" checked> Spotify</label>
    </div>
    <div class="overlayClose" id="closeSearch">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </div>
  </div>
  <div id="searchInputWrap">
    <div id="searchField">
      <input id="searchInput" type="search" placeholder="Mind. 2 Zeichen…" data-i18n-placeholder="html.searchPlaceholder"
        autocomplete="off" autocorrect="off" spellcheck="false">
      <div id="searchClear" title="Eingabe löschen" data-i18n-title="html.searchClear">
        <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
      </div>
    </div>
    <button id="searchGoBtn" data-i18n="html.searchGo">Los</button>
  </div>
  <div id="searchTabBar">
    <div class="qTab on" data-cat="artists" data-i18n="html.tab.artists">Künstler</div>
    <div class="qTab" data-cat="albums" data-i18n="html.tab.albums">Alben</div>
    <div class="qTab" data-cat="songs" data-i18n="html.tab.songs">Titel</div>
    <div class="qTab" data-cat="genres" id="searchTabGenres" style="display:none" data-i18n="html.tab.genres">Genres</div>
  </div>
  <div id="searchResults"></div>
</div>

<!-- Artist/album overlay (click on artist or album in the player) -->
<div class="overlay" id="overlayBrowse">
  <div class="overlayHandle"></div>
  <div class="overlayHead">
    <div id="browseBack" title="Zurück" data-i18n-title="html.back" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </div>
    <h2 id="browseTitle"></h2>
    <div class="overlayClose" id="closeBrowse">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </div>
  </div>
  <div id="browseBody"></div>
</div>

<!-- Menu (gear at the top right): history, library check, update library, Volumio UI -->
<div class="overlay" id="overlayMenu">
  <div class="overlayHandle"></div>
  <div class="overlayHead">
    <h2 data-i18n="html.menu">Menü</h2>
    <div class="overlayClose" id="closeMenu">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </div>
  </div>
  <div class="overlayBody" id="menuBody"></div>
</div>

<!-- Volumio overlay: direct access to the pages of the original Volumio UI -->
<div class="overlay" id="overlayVolumio">
  <div class="overlayHandle"></div>
  <div class="overlayHead">
    <div id="volumioBack" title="Zurück zum Menü" data-i18n-title="html.backToMenu">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </div>
    <h2>Volumio</h2>
    <a id="openVolumioTab" target="_blank" rel="noopener" title="In neuem Tab öffnen" data-i18n-title="html.openNewTab" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
    </a>
    <div class="overlayClose" id="closeVolumio">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </div>
  </div>
  <div id="volumioTabBar"></div>
  <div id="volumioPanel"><div class="qHint" id="volumioHint" data-i18n="html.volumioPick">Seite wählen</div></div>
</div>


<!-- Library check: problem cases in the collection, the pen opens the tag editor on top -->
<div class="overlay" id="overlayCheck">
  <div class="overlayHandle"></div>
  <div class="overlayHead">
    <div id="checkBack" title="Zurück zum Menü" data-i18n-title="html.backToMenu">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </div>
    <h2 data-i18n="html.libCheck">Bibliothek prüfen</h2>
    <div class="overlayClose" id="closeCheck">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </div>
  </div>
  <div class="overlayBody" id="checkBody"></div>
</div>

<div class="overlay" id="overlayHistory">
  <div class="overlayHandle"></div>
  <div class="overlayHead">
    <div id="historyBack" title="Zurück zum Menü" data-i18n-title="html.backToMenu">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </div>
    <h2 data-i18n="html.history">Verlauf</h2>
    <div class="overlayClose" id="closeHistory">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </div>
  </div>
  <div id="histTabBar">
    <div class="qTab on" data-tab="recent" data-i18n="html.tab.recent">Zuletzt</div>
    <div class="qTab" data-tab="top" data-i18n="html.tab.top">Meistgespielt</div>
    <div class="qTab" data-tab="stats" data-i18n="html.tab.stats">Statistik</div>
    <div class="qTab" data-tab="year" data-i18n="html.tab.year">Rückblick</div>
  </div>
  <div class="overlayBody" id="histBody"></div>
</div>

<!-- System (system.js): load, temperature, memory, drives -->
<div class="overlay" id="overlaySystem">
  <div class="overlayHandle"></div>
  <div class="overlayHead">
    <div id="systemBack" title="Zurück zum Menü" data-i18n-title="html.backToMenu">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </div>
    <h2 data-i18n="html.system">System</h2>
    <div class="overlayClose" id="closeSystem">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </div>
  </div>
  <div class="overlayBody" id="sysBody"></div>
</div>

<div class="overlay" id="overlayPlayback">
  <div class="overlayHandle"></div>
  <div class="overlayHead">
    <div id="playbackBack" title="Zurück zum Menü" data-i18n-title="html.backToMenu">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </div>
    <h2 data-i18n="html.playback">Wiedergabe</h2>
    <div class="overlayClose" id="closePlayback">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </div>
  </div>
  <div class="overlayBody" id="pbBody"></div>
</div>

<div class="overlay" id="overlayHelp">
  <div class="overlayHandle"></div>
  <div class="overlayHead">
    <div id="helpBack" title="Zurück zum Menü" data-i18n-title="html.backToMenu">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </div>
    <h2 data-i18n="html.help">Hilfe</h2>
    <div class="overlayClose" id="closeHelp">
